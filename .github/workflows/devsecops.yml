name: DevSecOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  foundry-ci:
    name: Build, Test, and Lint (Foundry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry versions
        run: |
          forge --version
          cast --version

      - name: Cache Foundry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            lib
          key: ${{ runner.os }}-foundry-${{ hashFiles('foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Format check (forge fmt)
        run: forge fmt --check
        continue-on-error: true

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Generate coverage report
        run: forge coverage

  slither-analysis:
    name: Static Analysis (Slither)
    runs-on: ubuntu-latest
    needs: foundry-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Slither
        run: |
          sudo add-apt-repository ppa:ethereum/ethereum -y
          sudo apt-get update
          sudo apt-get install -y solc
          pip install slither-analyzer

      - name: Run Slither
        continue-on-error: true
        run: |
          if [ ! -d "src" ] || ! ls src/*.sol >/dev/null 2>&1; then
            echo "No Solidity files found in src/, skipping Slither analysis."
            exit 0
          fi

          # Analyze contracts in src/ using solc directly
          # Slither may return a non-zero exit code on findings; we let the step "fail"
          # but do not fail the overall job/pipeline thanks to continue-on-error: true.
          slither ./src --solc-remaps "$(forge remappings 2>/dev/null | tr '\n' ',')"

  aderyn-analysis:
    name: Static Analysis (Aderyn)
    runs-on: ubuntu-latest
    needs: foundry-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts (Foundry)
        run: forge build

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install Aderyn
        run: cargo install aderyn

      - name: Run Aderyn
        run: |
          if [ ! -d "src" ] || ! ls src/*.sol >/dev/null 2>&1; then
            echo "No Solidity files found in src/, skipping Aderyn analysis."
            exit 0
          fi

          # Run Aderyn against the Foundry project in the current directory
          # Ensure the pipeline does not fail, and print the generated report.md
          set +e
          aderyn .
          aderyn_exit=$?

          if [ -f report.md ]; then
            echo "===== Aderyn Report (report.md) ====="
            cat report.md
          else
            echo "Aderyn report.md not found."
          fi

          echo "Aderyn exited with code: ${aderyn_exit}"
          # Do not fail the pipeline based on Aderyn's exit code
          exit 0

  opengrep-analysis:
    name: SAST (OpenGrep Trail of Bits)
    runs-on: ubuntu-latest
    needs: foundry-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash

      - name: Run Opengrep (Trail of Bits)
        run: |
          if [ ! -d "src" ] || ! ls src/*.sol >/dev/null 2>&1; then
            echo "No Solidity files found in src/, skipping Opengrep analysis."
            exit 0
          fi

          # Run Opengrep with the Trail of Bits ruleset
          set +e
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep scan --config "p/trailofbits" .
          og_exit=$?

          echo "Opengrep exited with code: ${og_exit}"
          # Do not fail the pipeline based on Opengrep's exit code
          exit 0
