name: DevSecOps CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  foundry-ci:
    name: Build, Test, and Lint (Foundry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry versions
        run: |
          forge --version
          cast --version

      - name: Cache Foundry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            lib
          key: ${{ runner.os }}-foundry-${{ hashFiles('foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Format check (forge fmt)
        run: forge fmt --check
        continue-on-error: true

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Generate coverage report
        run: forge coverage

  slither-analysis:
    name: Static Analysis (Slither)
    runs-on: ubuntu-latest
    needs: foundry-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Slither
        run: |
          sudo add-apt-repository ppa:ethereum/ethereum -y
          sudo apt-get update
          sudo apt-get install -y solc
          pip install slither-analyzer

      - name: Run Slither
        run: |
          slither . --ignore-compile --solc-remaps "$(forge remappings 2>/dev/null | tr '\n' ',')" || exit_code=$?
          # Allow informational findings but fail on real errors
          if [ "${exit_code:-0}" -ne 0 ]; then
            echo "Slither found issues."
            exit $exit_code
          fi

